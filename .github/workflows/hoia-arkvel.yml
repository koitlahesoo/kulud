# Tasuta Supabase'i projekt pannakse pausile, kui seda nädal aega ei kasutata.
# See töövoog teeb kaks korda nädalas ühe väikese päringu, et projekt püsiks aktiivne.
name: Hoia Supabase ärkvel

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Päring andmebaasi
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)';/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_KEY = '\(.*\)';/\1/p" config.js)
          curl -sS -f -o /dev/null -w "HTTP %{http_code}\n" \
            "$URL/rest/v1/kululiigid?select=kululiigi_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
